<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Tribe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --border: rgba(255,255,255,0.08);
      --text: #e8e6e0;
      --muted: #6b6963;
      --accent: #c8f55a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    header {
      padding: 2.5rem;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'DM Mono', monospace;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      color: var(--accent);
      text-transform: uppercase;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5rem 2.5rem;
    }

    .tagline {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 300;
      line-height: 1.1;
      letter-spacing: -0.02em;
      max-width: 600px;
      margin-bottom: 5rem;
    }

    .tagline em {
      font-style: normal;
      color: var(--accent);
    }

    .contact-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .contact-list li {
      display: flex;
      align-items: baseline;
      gap: 1.5rem;
    }

    .contact-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      min-width: 80px;
    }

    .contact-value {
      font-size: 0.95rem;
      color: var(--text);
    }

    .contact-value a:hover { color: var(--accent); }

    footer {
      padding: 2rem 2.5rem;
      border-top: 1px solid var(--border);
    }

    .footer-copy {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    @media (max-width: 480px) {
      header, main, footer { padding-left: 1.5rem; padding-right: 1.5rem; }
      main { padding-top: 3rem; padding-bottom: 3rem; }
    }
  </style>
</head>
<body>

  <header>
    <span class="logo">Crypto Tribe</span>
  </header>

  <main>
    <p class="tagline">Secure and reliable<br><em>proof of stake</em><br>validator.</p>

    <ul class="contact-list">
      <li>
        <span class="contact-label">Founder</span>
        <span class="contact-value">Eugene Luzgin</span>
      </li>
      <li>
        <span class="contact-label">Email</span>
        <span class="contact-value"><a href="mailto:eugene@cryptotribe.io">eugene@cryptotribe.io</a></span>
      </li>
      <li>
        <span class="contact-label">Telegram</span>
        <span class="contact-value"><a href="https://t.me/eluzgin" target="_blank" rel="noopener">@eluzgin</a></span>
      </li>
    </ul>
  </main>

  <footer>
    <span class="footer-copy">cryptotribe.io</span>
  </footer>

</body>
</html>
